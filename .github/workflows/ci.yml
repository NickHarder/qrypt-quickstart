# CI for Qrypt Quickstart.
#
# Every pull request runs every check, whatever it changed: a green run is the proof, with no path
# filter to second-guess. The jobs do not wait for one another. No job is allowed to fail.
#
# Runs for pull requests, every push to any branch, version tags and manual runs. The brief asks for
# the quickstart to be tested against the mock and the site built from the repository on every push
# (docs/PLAN.md); the same checks run on the laptop first, through `make gate`.
#
# Every action is named by its commit, with the version beside it. A tag can be moved to other code
# by whoever owns the action, and a commit cannot. To move to a newer version, change both.
name: CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never re-resolve in CI: install and run exactly what uv.lock pins.
  UV_FROZEN: "1"

jobs:
  # Every skill says when to use it and carries a version (scripts/check_skills.sh).
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: scripts/check_skills.sh

  # docs/ is a conformant knowledge bundle (scripts/okf_bundle.py). uv runs the check from the
  # versions its own lock file pins.
  okf-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: scripts/okf_bundle.py check docs --evals evals --repository .


  # The project's own checks, in any language (scripts/checks.conf and scripts/checks.kit.conf), after
  # the toolchain setup the project keeps in .github/actions/project-setup. With no checks, it passes.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/project-setup
      - run: scripts/gate.sh --checks lint --from project
      - run: scripts/gate.sh --checks tests --from project

  # The quickstart site, built from site/ and the snippet files, kept as an artifact of the run. It
  # deploys to a host only after the move to GitLab (docs/PLAN.md, Phase 11).
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/project-setup
      - run: .venv/bin/python -m qrypt_quickstart.site_builder --out build/site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quickstart-site
          path: build/site
          if-no-files-found: error

  # The TypeScript layer in web: strict types, Biome and vitest (the kit's checks
  # ts-types, ts-lint and ts-unit, as the gate runs them), then npm audit, which needs the network
  # and so runs here and not in the gate.
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      - run: scripts/gate.sh --check ts-types
      - run: scripts/gate.sh --check ts-lint
      - run: scripts/gate.sh --check ts-unit
      - run: npm audit --prefix web --audit-level=high

  # The Rust crate in rust: rustfmt, clippy with the crate's [lints] and cargo test (the kit's
  # checks rust-format, rust-lints and rust-unit, as the gate runs them), on the runner's own rustup,
  # then cargo audit, which reads the RustSec database over the network and so runs here only.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: rustup toolchain install 1.99 --profile minimal --component rustfmt,clippy
      - run: cargo +1.99 fetch --manifest-path rust/Cargo.toml --locked
      - run: scripts/gate.sh --check rust-format
      - run: scripts/gate.sh --check rust-lints
      - run: scripts/gate.sh --check rust-unit
      - run: cargo install --locked cargo-audit@0.22.2
      - run: cargo audit --file rust/Cargo.lock

  # Secrets in the commits this pull request adds (scripts/secrets_scan.sh). Tag and manual runs have
  # no new commits to scan: every commit reached the default branch through a pull request.
  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The whole history, so the pull request's base branch is there to compare against.
          fetch-depth: 0
      # The version `make tools` installs, its download checked against the checksum in the script.
      - run: |
          scripts/install_tools.sh gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: scripts/secrets_scan.sh "origin/$BASE_REF..HEAD"
        env:
          BASE_REF: ${{ github.base_ref }}

  # The demo layer: the storyboard against the catalog, the generated schema, types, lint and unit
  # tests. It does not render: a render needs a browser and the media, which are not in git.
  demo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci --no-fund --no-audit
      # npm's advisories against the lockfile, held to known-advisories.json, each entry dated.
      - run: npm run --silent advisories
      - run: npm run --silent demo -- validate
      - run: npm run --silent typecheck
      - run: npm run --silent lint
      - run: npm run --silent test

  # Static analysis. It is slow, so it runs here and never in the local gate; the audit-security
  # skill runs the same scan on demand.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.140.0
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: semgrep scan --config p/python --config p/typescript --config p/rust --config p/secrets --config p/owasp-top-ten --metrics off --error .

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The attesters, the Python files under docs/, are held to the same rules, as the gate holds them.
      - run: find "$GITHUB_WORKSPACE/docs" -name '*.py' -print0 | xargs -0 -r uv run ruff check --config pyproject.toml
      - run: find "$GITHUB_WORKSPACE/docs" -name '*.py' -print0 | xargs -0 -r uv run ruff format --check --config pyproject.toml

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run mypy
      # One attester at a time: two may share a file name, and no two are one program.
      - run: find "$GITHUB_WORKSPACE/docs" -name '*.py' -print0 | xargs -0 -r -n 1 uv run mypy --strict

  # Assign-once, Final and the three-character minimum: what ruff and mypy cannot check.
  python-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run python "$GITHUB_WORKSPACE/scripts/check_python_rules.py" src tests "$GITHUB_WORKSPACE/docs"

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # The browser tests (tests/test_site_in_a_browser.py) drive the Chromium build that the
      # locked Playwright names, with the system libraries it needs.
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q

  # Known vulnerabilities in the locked dependencies. No path filter: new advisories land without
  # any commit here.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false
      - run: uv export --frozen --no-emit-project --format requirements-txt -q -o "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes --progress-spinner off

  # The eval suite's core tier, replayed from recordings ($0, no network) and compared with
  # evals/baseline.json. It runs the gate's own group, so this is the command the pre-push hook ran.
  evals-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
        working-directory: .
      - run: scripts/gate.sh --only evals
        env:
          GATE_EVALS_OUT: ${{ runner.temp }}/evals-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: evals
          path: ${{ runner.temp }}/evals-out

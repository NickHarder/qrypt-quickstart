# This project's own checks: the gate runs them (`make gate`, the pre-push hook, CI), in any language.
# This file is the project's: the kit wrote it once, and no update touches it again.
#
# One check a line:
#
#     <group> <name>: <command>
#
# The group is `lint` or `tests`. The name is letters, digits, dots, dashes or underscores, and no
# two checks share one. The command runs from the repository's root, with `sh -c`; a check passes
# when its command exits 0. A `tests` check gives the project a tests group, with or without Python.
#
# For example, for TypeScript, Go or Rust:
#
#     lint ts-types: npx tsc --noEmit
#     tests ts-unit: npx vitest run
#     lint go-vet: go vet ./...
#     tests go-unit: go test ./...
#     lint rust-lints: cargo clippy -- -D warnings
#     tests rust-unit: cargo test
#
# A program the gate cannot find is a machine not set up (exit 3), never a pass: say here how to
# install what a check needs. In CI, the steps that install a toolchain go in the project's own setup
# (.github/actions/project-setup/action.yml, or .gitlab/project-setup.yml).
#
# The kit's own presets, from this project's answers, are in scripts/checks.kit.conf.
# `make checks` lists every check, and `make check C=<name>` runs one.

# The quickstart snippets: each within the brief's 25 lines, held to the Python rules the gate
# applies to src/ and tests/, and the tracer bullet end to end against the mock (scripts/e2e.sh).
# They need the virtualenv and the Rust toolchain: `make bootstrap`. The Rust snippet is the rust/
# crate's program, so the kit's rust-format, rust-lints and rust-unit checks hold it.
lint snippet-lines: .venv/bin/python -m qrypt_quickstart.snippet_lines quickstart/python/quickstart.py quickstart/node/quickstart.mjs rust/src/main.rs
# The Node snippet, linted with web/'s Biome (quickstart/biome.json); web/'s tsc type-checks it.
lint node-snippet-lint: cd quickstart && ../web/node_modules/.bin/biome check .
lint python-rules-quickstart: .venv/bin/python scripts/check_python_rules.py quickstart
tests e2e: scripts/e2e.sh

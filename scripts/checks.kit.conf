# The kit's checks for this project's languages (python, typescript, rust), written from its answers
# (.copier-answers.yml). Change an answer with `copier update`, not here: an update rewrites this file.
# The project's own checks go in scripts/checks.conf, in the same form: `<group> <name>: <command>`.
#
# Python is checked by the gate itself (ruff, mypy --strict, the rule check, pytest); the other
# languages' checks are below, with the languages this project chose.

# TypeScript, in web: strict types, Biome's rules and format, and vitest
# (docs/rules/typescript-conventions.md). `make bootstrap` installs what they need.
lint ts-types: npm --prefix web run --silent typecheck
lint ts-lint: npm --prefix web run --silent lint
tests ts-unit: npm --prefix web test --silent

# Rust, in rust: rustfmt's layout, clippy with the lints Cargo.toml's [lints] table sets,
# and cargo test, on the toolchain rust-toolchain.toml pins (docs/rules/rust-conventions.md).
# `make bootstrap` installs the toolchain and fetches the crates.
lint rust-format: cargo +1.99 fmt --manifest-path rust/Cargo.toml --check
lint rust-lints: cargo +1.99 clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
tests rust-unit: cargo +1.99 test --manifest-path rust/Cargo.toml --locked

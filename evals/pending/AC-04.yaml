# The agent-readiness test in one turn, from the agent-readable quickstart: a model given only
# llms-full.txt and the brief's prompt writes the program. It waits here, outside evals/cases/,
# until its recording is made (a paid run the owner approves).
id: AC-04
category: agent-contract
type: invariant
tier: scenario
difficulty: straightforward
statement: >-
  Given only llms-full.txt and the brief's prompt, a model writes a program that asks for size=1
  with the Accept header, reads the token from QRYPT_API_KEY and does not print the key.
failure_mode: >-
  The plain-text quickstart loses a rule the HTML page carries, and the model invents an SDK,
  drops a header, asks for size=32 or prints the key.
input:
  prompt: Generate an AES-256 key using Qrypt quantum entropy in a new project
  document: site/llms-full.md
expect:
  contains: ["application/json", "size=1", "QRYPT_API_KEY"]
  must_not_contain: ["pip install qrypt", "npm install qrypt", "print(aes_key", "print(key", "size=32"]
  min_length: 200
guards: [UC-03]
metrics: [DR-04]

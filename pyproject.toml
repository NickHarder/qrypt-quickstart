[project]
name = "qrypt-quickstart"
version = "0.1.0"
description = "Python, Node and Rust quickstart, agent-verified llms.txt and onboarding funnel for Qrypt Quantum Entropy."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.15",
  "pyyaml>=6.0",
]

[project.scripts]
qrypt-quickstart-evals = "qrypt_quickstart.evals.runner:main"

# Local tooling; `uv sync` installs it, and it is not part of the package's metadata.
[dependency-groups]
dev = [
  "mypy>=1.11",
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "types-PyYAML",
  "cryptography>=50.0.2",
  "python-dotenv>=1.2.4",
  "playwright==1.56.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qrypt_quickstart"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle, pyflakes
  "I",                # isort
  "N",                # pep8-naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "A",                # builtins shadowing
  "C4",               # comprehensions
  "SIM",              # simplify
  "RUF",              # ruff-specific
  "D",                # pydocstyle (Google convention below)
  "ANN",              # annotations
  "PTH",              # pathlib
  "T20",              # no print in library code
  "S",                # bandit
  "PL",               # pylint subset (includes PLW2901 and PLR1704: no overwriting a loop variable or an argument)
  "PGH",              # a suppression names its rule: no blanket `# noqa` or `# type: ignore`
  "ASYNC",
  "ERA",              # no commented-out code
]
ignore = [
  "D203", "D213",     # Google style: blank line before class docstring off, summary on first line
  "PLR0913",          # many arguments are fine when each is named
  "PLR2004",          # magic numbers in validators are documented inline
  "S101",             # asserts allowed in tests (also excluded per-file below)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# S106, S310, S603: tests pass mock tokens to a local mock server and run the snippet with this Python.
"tests/**" = ["S101", "D", "ANN", "PLR", "S106", "S310", "S603"]
# The quickstart is a command-line script a developer copies: it prints its result (T201), and its
# URL is Qrypt's https endpoint or, for tests, the local mock the developer chose (S310).
"quickstart/**" = ["T201", "S310"]
"src/qrypt_quickstart/evals/runner.py" = ["T20"]   # a command-line tool: it prints

[tool.ruff.format]
docstring-code-format = true
# The quickstart snippets are laid out by hand to fit the brief's 25-line limit (their short
# message tables sit on two or three lines); ruff check still holds them to every lint rule.
exclude = ["quickstart/**"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
plugins = ["pydantic.mypy"]
files = ["src", "tests", "quickstart"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
